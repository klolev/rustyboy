[package]
name = "gamegirl-core"
version = "0.1.0"
authors = ["klolev <chloe.leveille.a@gmail.com>"]
edition = "2018"

[dependencies]
uniffi = { version = "0.25" }
thiserror = "1.0.56"
rand = { version = "*", features = ["small_rng"] }

[build-dependencies]
uniffi = { version = "0.25", features = ["build"] }

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "gamegirl_core"
